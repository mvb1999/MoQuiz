name: Seed current MOQUIZ frontend

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/seed-from-vercel.yml"

permissions:
  contents: write

jobs:
  seed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current production frontend
        run: curl -fL https://moqui.vercel.app -o index.html
      - name: Commit frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Import current MOQUIZ frontend"
            git push
          fi
