name: Tests

# Läuft bei jedem Push und jedem Pull Request. Ein roter Haken bedeutet:
# Etwas ist kaputt, bevor es live geht.
on:
  push:
  pull_request:

jobs:
  oberflaeche:
    name: Oberfläche (Host, Beamer, Handys)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          MOQUIZ_SHOTS: ${{ github.workspace }}/tests/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tests/screenshots
          if-no-files-found: ignore
          retention-days: 7

  datenbank:
    name: Datenbank (Migrationen und Funktionen)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "psycopg[binary]"
      - run: bash tests/sql/run.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
